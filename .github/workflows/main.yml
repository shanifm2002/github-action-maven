name: Java CI with Maven

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:

    runs-on: ec2

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: working dir
        run: pwd

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: List Generated Files
        run: ls -l target/
